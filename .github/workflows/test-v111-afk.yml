name: v1.11 policy test (source only)
on:
  push:
    branches: [feature/v1.11-session-afk]
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test AFK policy
        run: |
          mkdir -p build/classes
          javac -source 8 -target 8 -d build/classes src/afk/git/artdeell/mojo/afk/AfkPolicyV111.java tests/AfkPolicyV111Test.java
          java -ea -cp build/classes AfkPolicyV111Test
