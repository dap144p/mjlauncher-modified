name: Build MJ Launcher v13 Modified APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mj-v13-afk20.yml'
      - 'MJLauncher-v13-GitHub-patch.zip'
      - 'scripts/apply-startup-compat.py'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Unpack and validate v13 overlay
        shell: bash
        run: |
          set -euo pipefail
          unzip -t MJLauncher-v13-GitHub-patch.zip | tail -1
          mkdir -p overlay
          unzip -q MJLauncher-v13-GitHub-patch.zip -d overlay
          test -f overlay/v13-patch/scripts/apply-v13-source.sh
          # Validate overlay in the form in which its tests were authored.
          python3 overlay/v13-patch/scripts/validate-v13-sessions.py
          python3 overlay/v13-patch/scripts/validate-v13-afk.py
          # Keep Android package and storage aligned with the requested .modified suffix.
          python3 - <<'PY'
          from pathlib import Path
          root=Path("overlay/v13-patch")
          old=b"git.artdeell.mjlaunch.v13.modified"
          new=b"git.artdeell.mjlaunch.modified"
          changed=0
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix in (".jar",".zip",".so",".png",".aar"):
                  continue
              src=p.read_bytes()
              if old in src:
                  p.write_bytes(src.replace(old,new))
                  changed+=1
          print(f"Updated package references in {changed} files.")
          assert changed >= 3
          PY

      - name: Download official Justicia Hotfix 1 source
        shell: bash
        run: |
          git clone https://github.com/MojoLauncher/MojoLauncher.git upstream
          git -C upstream checkout f6c5ae4f846ab62a1131ad49c3192222ea8e1f25
          git -C upstream submodule update --init --recursive

      - name: Apply v13 source changes
        run: bash overlay/v13-patch/scripts/apply-v13-source.sh upstream

      - name: Add safe compatibility launch for Minecraft startup diagnostics
        run: python3 scripts/apply-startup-compat.py upstream

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --version
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Configure Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Retrieve optional LTW artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: upstream/app_mojo/libs

      - name: Retrieve optional Mesa artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: upstream/app_mojo/libs

      - name: Compile full debug APK
        working-directory: upstream
        env:
          CURSEFORGE_API_KEY: DUMMY
        run: gradle :app_mojo:assembleFullDebug --stacktrace --no-daemon

      - name: Validate APK installation metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="upstream/app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='git.artdeell.mjlaunch.modified'"
          cp "$APK" MJLauncher-Justicia-H1-v13-Modified-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MJLauncher-v13-Modified-APK
          path: MJLauncher-Justicia-H1-v13-Modified-debug.apk
          if-no-files-found: error
