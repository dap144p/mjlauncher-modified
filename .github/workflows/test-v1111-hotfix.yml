name: v1.11.1 AFK OpenAL and GLFW diagnostic tests

on:
  push:
    branches: [feature/v1.11-session-afk]
    paths:
      - '.github/workflows/test-v1111-hotfix.yml'
      - 'src/afk/**'
      - 'tests/hotfix/**'
      - 'patches/build-engine-v111.sh'
  pull_request:

permissions:
  contents: read

jobs:
  test-afk-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Obtain test-only ASM dependencies
        run: |
          set -euo pipefail
          mkdir -p build/asm-deps
          for name in asm asm-tree asm-commons; do
            curl --fail --location --silent --show-error               "https://repo.maven.apache.org/maven2/org/ow2/asm/${name}/9.7.1/${name}-9.7.1.jar"               --output "build/asm-deps/${name}.jar"
          done
      - name: Compile and run real Java agent instrumentation test
        run: |
          set -euo pipefail
          bash patches/build-engine-v111.sh build/asm-deps build/agent.jar
          mkdir -p build/test-classes build/state
          javac -source 8 -target 8 -Xlint:none -d build/test-classes $(find tests/hotfix -name '*.java' | sort)
          printf 1 > build/state/enabled
          printf 0 > build/state/process-123.state
          java -javaagent:build/agent.jar="$(pwd)/build/state/process-123.state"             -cp build/test-classes test.Game "$(pwd)/build/state/process-123.state"
