name: Export Android APK Signing Tools
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-android-signing-tools.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Android SDK build-tools 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'build-tools;36.0.0'
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$BT/lib/apksigner.jar"
          test -x "$BT/zipalign"
          mkdir -p output/lib
          cp "$BT/lib/apksigner.jar" output/lib/
          cp "$BT/zipalign" "$BT/aapt" output/
          cp -a "$BT/lib64" output/ || true
      - name: Export build tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-signing-tools-36
          path: output
          if-no-files-found: error
