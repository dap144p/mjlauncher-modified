name: Validate MJ Launcher v1.12.0 Source

on:
  push:
    branches: [main, 'release/v1.12.0']
    paths:
      - '.github/workflows/verify-v112.yml'
      - 'scripts/prepare-v112.py'
      - 'src/afk/**'
      - 'tests/monitor-compat/**'
      - 'patches/build-engine-v111.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Syntax check
        run: python3 -m py_compile scripts/prepare-v112.py
      - name: Obtain isolated test dependencies and official 1.13/1.14 JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/asm-deps build/mojang
          for name in asm asm-tree asm-commons; do
            curl -fLsS "https://repo.maven.apache.org/maven2/org/ow2/asm/${name}/9.7.1/${name}-9.7.1.jar" -o "build/asm-deps/${name}.jar"
          done
          curl -fLsS 'https://piston-data.mojang.com/v1/objects/c0b970952cdd279912da384cdbfc0c26e6c6090b/client.jar' -o build/mojang/1.13.jar
          curl -fLsS 'https://piston-data.mojang.com/v1/objects/7a762a59345c13af7d87111207a93f5a8607f6c0/client.jar' -o build/mojang/1.14.jar
          echo 'c0b970952cdd279912da384cdbfc0c26e6c6090b  build/mojang/1.13.jar' | sha1sum -c
          echo '7a762a59345c13af7d87111207a93f5a8607f6c0  build/mojang/1.14.jar' | sha1sum -c
      - name: Compile v1.12 embedded Java agent
        run: bash patches/build-engine-v111.sh build/asm-deps build/agent.jar
      - name: Test original Minecraft 1.13 and 1.14 monitor-bytecode instrumentation
        run: |
          set -euo pipefail
          mkdir -p build/probe
          javac -source 8 -target 8 -Xlint:none -cp build/agent.jar -d build/probe tests/monitor-compat/BytecodePatchProbe.java
          java -cp build/probe:build/agent.jar monitor.test.BytecodePatchProbe build/mojang/1.13.jar build/mojang/1.14.jar
          rm -f build/mojang/*.jar
